name: Frontend Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v3

      - name: 📦 Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"

      - name: 📦 Install Dependencies
        run: |
          cd frontend
          npm install

      - name: 🧪 Run Jest Tests
        run: |
          cd frontend
          npm run test
